<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamze Eczanesi | Sipariş Sistemine Bağlanılıyor...</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; color: #0f172a;
    }
    .box {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 32px 28px;
      text-align: center; max-width: 400px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #16a34a;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 13.5px; color: #64748b; margin: 0; line-height: 1.5; }
    .btn {
      display: inline-block; margin-top: 16px; padding: 10px 18px; background: #16a34a;
      color: #fff; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="sp"></div>
    <h2 id="ttl">🏥 Gamze Eczanesi</h2>
    <p id="msg">Güvenli sunucuya yönlendiriliyorsunuz, lütfen bekleyin...</p>
    <div id="linkArea"></div>
  </div>
  <script>
    async function redirectNow() {
      try {
        const res = await fetch('https://api.github.com/repos/eczacicagri/gamze/contents/tunnel.json?t=' + Date.now(), {
          cache: 'no-store'
        });
        const meta = await res.json();
        const decoded = JSON.parse(atob(meta.content.replace(/\s/g, '')));
        if (decoded && decoded.url) {
          document.getElementById('msg').textContent = 'Bağlantı kuruldu, açılıyor...';
          document.getElementById('linkArea').innerHTML = '<a class="btn" href="' + decoded.url + '">Hemen Giriş Yap</a>';
          window.location.replace(decoded.url);
          return;
        }
      } catch (e) {}
      document.getElementById('sp').style.display = 'none';
      document.getElementById('msg').textContent = 'Sunucu bağlantısı kontrol ediliyor. Lütfen sayfayı yenileyin.';
    }
    redirectNow();
  </script>
</body>
</html>
